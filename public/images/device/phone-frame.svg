<!--
  스마트폰 프레임 (화면 자리는 비어 있음 → 뒤에 있는 스크린샷이 보임)
  - 전체 372 x 780 : 본체 360 x 780 (9 : 19.5) + 좌우 버튼 자리 6씩
  - 본체 위치 x 6~366, 베젤 두께 11, 바깥 모서리 54, 화면 모서리 43
  - 화면 맨 위 상태 표시줄(시간 · 신호 · 와이파이 · 배터리) 높이 48 → 스크린샷은 y 59부터
  - css/device-phone.css 에서 이 숫자에 맞춰 화면 위치를 잡음
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 780">
  <defs>
    <!-- 금속 테두리 · 버튼 색 -->
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a5a5e"/>
      <stop offset=".45" stop-color="#2a2a2d"/>
      <stop offset="1" stop-color="#4a4a4e"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3a3d"/>
      <stop offset=".5" stop-color="#6a6a6e"/>
      <stop offset="1" stop-color="#2a2a2d"/>
    </linearGradient>
  </defs>

  <!-- 측면 버튼 (본체 뒤에 그려서 바깥쪽만 살짝 보이게) -->
  <rect x="2" y="138" width="6" height="32" rx="2" fill="url(#btn)"/>   <!-- 왼쪽: 동작 버튼 -->
  <rect x="2" y="192" width="6" height="58" rx="2" fill="url(#btn)"/>   <!-- 왼쪽: 볼륨 + -->
  <rect x="2" y="264" width="6" height="58" rx="2" fill="url(#btn)"/>   <!-- 왼쪽: 볼륨 - -->
  <rect x="364" y="218" width="6" height="94" rx="2" fill="url(#btn)"/> <!-- 오른쪽: 전원 -->

  <!-- 본체(베젤): 바깥 둥근 사각형에서 화면 자리를 뚫어 냄 -->
  <path fill="#0b0b0c" fill-rule="evenodd" d="
    M60 0 H312 A54 54 0 0 1 366 54 V726 A54 54 0 0 1 312 780 H60 A54 54 0 0 1 6 726 V54 A54 54 0 0 1 60 0 Z
    M60 11 H312 A43 43 0 0 1 355 54 V726 A43 43 0 0 1 312 769 H60 A43 43 0 0 1 17 726 V54 A43 43 0 0 1 60 11 Z"/>

  <!-- 금속 테두리 -->
  <rect x="6.9" y=".9" width="358.2" height="778.2" rx="53.1" fill="none" stroke="url(#metal)" stroke-width="1.8"/>
  <!-- 화면 가장자리의 아주 옅은 유리 반사 -->
  <rect x="16.5" y="10.5" width="339" height="759" rx="43.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- 상태 표시줄 (흰 배경, y 11~59 = 높이 48)
       스크린샷은 이 아래(y 59)부터 보이도록 css/device-phone.css 에서 내려 줌 -->
  <path fill="#ffffff" d="M17 59 V54 A43 43 0 0 1 60 11 H312 A43 43 0 0 1 355 54 V59 Z"/>
  <g fill="#0a0a0a">
    <!-- 시간 -->
    <text x="80" y="41.5" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="-.2">9:41</text>
    <!-- 신호 막대 4개 -->
    <rect x="261" y="38" width="3" height="4" rx=".8"/>
    <rect x="265.5" y="36" width="3" height="6" rx=".8"/>
    <rect x="270" y="34" width="3" height="8" rx=".8"/>
    <rect x="274.5" y="32" width="3" height="10" rx=".8"/>
    <!-- 와이파이 -->
    <circle cx="290" cy="40.6" r="1.6"/>
  </g>
  <g fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round">
    <path d="M286.2 37.4 A5.4 5.4 0 0 1 293.8 37.4"/>
    <path d="M283.3 34.4 A9.6 9.6 0 0 1 296.7 34.4"/>
  </g>
  <!-- 배터리 -->
  <rect x="303.5" y="32.5" width="22" height="11" rx="3" fill="none" stroke="#0a0a0a" stroke-opacity=".4"/>
  <rect x="305.5" y="34.5" width="18" height="7" rx="1.6" fill="#0a0a0a"/>
  <rect x="326.6" y="35.6" width="1.8" height="4.8" rx=".9" fill="#0a0a0a" fill-opacity=".4"/>

  <!-- 다이내믹 아일랜드 + 카메라 -->
  <rect x="141" y="23" width="90" height="26" rx="13" fill="#000"/>
  <circle cx="217" cy="36" r="5" fill="#15161a"/>
  <circle cx="215.6" cy="34.6" r="1.4" fill="#3b4a6a" opacity=".8"/>
</svg>
